<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="DemonRider" />
    <title>Controle de Cinemática</title>
    <link rel="stylesheet" href="./src/controls.css" />
  </head>
  <body class="booting">
    <main id="controls" aria-live="polite">
      <h1>Cinemática Sincronizada</h1>

      <section class="music-panel" aria-labelledby="music-heading">
        <h2 id="music-heading">Música</h2>
        <p id="music-current" class="music-current" data-gm-only>Carregando faixas…</p>
        <div class="music-transport" data-gm-only>
          <button
            id="music-toggle"
            class="music-toggle"
            type="button"
            aria-label="Reproduzir música"
            disabled
          >
            ▶
          </button>
          <span id="music-current-time" class="music-time">00:00</span>
          <input
            id="music-progress"
            type="range"
            min="0"
            max="1"
            step="0.1"
            value="0"
            aria-label="Posição da música"
            disabled
          />
          <span id="music-duration" class="music-time">00:00</span>
        </div>
        <div id="music-track-list" class="music-track-list" aria-label="Faixas" data-gm-only>
          <button type="button" data-track-id="o-porao" disabled>O Porão</button>
          <button type="button" data-track-id="o-idolo" disabled>O Ídolo</button>
        </div>
        <div class="volume-control">
          <label for="music-volume">Volume</label>
          <input
            id="music-volume"
            type="range"
            min="0"
            max="100"
            step="1"
            value="100"
            aria-label="Volume das Trilhas"
            disabled
          />
          <output id="music-volume-value" for="music-volume">100%</output>
        </div>
        <p id="music-status" class="secondary" data-gm-only>Aguardando estado sincronizado…</p>
      </section>

      <section class="emf-panel" aria-labelledby="emf-heading">
        <h2 id="emf-heading">EMF</h2>
        <div class="emf-list" aria-label="Áudios EMF" data-gm-only>
          <button type="button" data-emf-id="emf-1" disabled>EMF 1</button>
          <button type="button" data-emf-id="emf-2" disabled>EMF 2</button>
          <button type="button" data-emf-id="emf-3" disabled>EMF 3</button>
        </div>
        <div class="volume-control">
          <label for="effects-volume">Volume</label>
          <input
            id="effects-volume"
            type="range"
            min="0"
            max="100"
            step="1"
            value="100"
            aria-label="Volume dos Efeitos"
            disabled
          />
          <output id="effects-volume-value" for="effects-volume">100%</output>
        </div>
        <p id="emf-status" class="secondary" data-gm-only>Aguardando estado sincronizado…</p>
      </section>

      <section class="cinematic-panel" aria-labelledby="cinematic-heading" data-gm-only>
        <h2 id="cinematic-heading">Cinemática</h2>
        <p id="overall-state" class="overall-state">Estado: Preparando…</p>
        <p id="ready-count">Clientes prontos: 0 / 0</p>
        <p id="sync-count" class="secondary">Sincronizados: 0 / 0</p>
        <ul id="client-list"></ul>
        <p id="policy-message" class="policy"></p>
        <button id="play-button" type="button" disabled>REPRODUZIR</button>
      </section>

      <details data-gm-only>
        <summary>Diagnóstico técnico</summary>
        <textarea id="diagnostics" readonly spellcheck="false"></textarea>
        <button id="copy-diagnostics" class="secondary-button" type="button">
          Copiar diagnóstico
        </button>
        <span id="copy-result" role="status"></span>
      </details>
    </main>
    <script type="module" src="./src/controls.ts"></script>
  </body>
</html>
