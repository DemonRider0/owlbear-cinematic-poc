<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnóstico B</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; }
      dt { font-weight: 600; }
      dd { margin: 0; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>SDK HANDSHAKE OK</h1>
    <dl id="diagnostics"></dl>
    <script>
      const diagnostics = document.querySelector("#diagnostics");
      for (const [key, value] of new URLSearchParams(window.location.search)) {
        const term = document.createElement("dt");
        const detail = document.createElement("dd");
        term.textContent = key;
        detail.textContent = value;
        diagnostics.append(term, detail);
      }
    </script>
  </body>
</html>
